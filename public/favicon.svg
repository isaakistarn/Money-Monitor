<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Money Monitor app icon">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="bill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#063e30" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#tile)"/>

  <!-- back bill, for a stacked-banknote sense of depth -->
  <g transform="rotate(-9 256 256)">
    <rect x="128" y="180" width="256" height="152" rx="20" fill="#ffffff" opacity="0.4"/>
  </g>

  <!-- front bill -->
  <g transform="rotate(8 256 256)" filter="url(#shadow)">
    <rect x="104" y="176" width="304" height="172" rx="24" fill="url(#bill)"/>
    <rect x="124" y="196" width="264" height="132" rx="14" fill="none" stroke="#34d399" stroke-width="4" opacity="0.55"/>

    <!-- $ medallion -->
    <circle cx="256" cy="262" r="52" fill="#d1fae5"/>
    <circle cx="256" cy="262" r="52" fill="none" stroke="#10b981" stroke-width="5"/>
    <g stroke="#059669" stroke-linecap="round" fill="none">
      <path d="M286 242 C286 226 226 226 226 250 C226 274 286 256 286 282 C286 302 240 302 226 288" stroke-width="15"/>
      <path d="M256 224 V300" stroke-width="13"/>
    </g>
  </g>
</svg>
