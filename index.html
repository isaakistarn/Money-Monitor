<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content Security Policy (defense-in-depth). The app ships no inline scripts,
      so script-src is locked to 'self' — this contains any XSS and, crucially for
      a finance app, stops injected code from exfiltrating data or the Supabase
      auth token (kept in localStorage) to an attacker-controlled host.
      connect-src is the allow-list of everywhere the app is permitted to talk to:
        · *.supabase.co  — cross-device sync + auth (REST + realtime websocket)
        · corsproxy.io   — the keyless price/search proxy (Yahoo is only reached
                           through it, never directly). This is the fallback:
                           when VITE_QUOTES_PROXY is set, the build replaces it
                           here with your self-hosted worker's origin — strongly
                           recommended, since an OPEN proxy in connect-src is an
                           exfiltration route (see SECURITY.md).
      img-src adds the Financial Modeling Prep logo endpoint. 'unsafe-inline' is
      needed only for styles (React/Chart.js set inline style attributes); scripts
      get no such exception. Note: frame-ancestors / X-Frame-Options can't be set
      from a <meta> tag on GitHub Pages — clickjacking protection would need real
      response headers if the host ever supports them.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://financialmodelingprep.com; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://corsproxy.io; worker-src 'self'; manifest-src 'self'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Money Monitor" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Money Monitor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
